[project]
name = "nhuc"
version = "0.1.0"
description = "Unit commitment of the German thermal fleet and water values of Norwegian hydropower from open data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "requests>=2.31",
    "openpyxl>=3.1",
    "pyarrow>=15",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
